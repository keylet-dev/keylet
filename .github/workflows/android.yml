name: Android CI

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'

      - name: Prepare signing keystore
        run: |
          if [ -n "${{ secrets.KEYLET_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYLET_KEYSTORE_BASE64 }}" | base64 -d > /tmp/keylet-release.keystore
            echo "KEYLET_KEYSTORE_PATH=/tmp/keylet-release.keystore" >> $GITHUB_ENV
            echo "KEYLET_KEYSTORE_PASSWORD=${{ secrets.KEYLET_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEYLET_KEY_ALIAS=${{ secrets.KEYLET_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEYLET_KEY_PASSWORD=${{ secrets.KEYLET_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore /tmp/keylet-release.keystore \
              -storetype PKCS12 \
              -alias keylet \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass keylet-ci -keypass keylet-ci \
              -dname "CN=Keylet, O=Keylet"
            echo "KEYLET_KEYSTORE_PATH=/tmp/keylet-release.keystore" >> $GITHUB_ENV
            echo "KEYLET_KEYSTORE_PASSWORD=keylet-ci" >> $GITHUB_ENV
            echo "KEYLET_KEY_ALIAS=keylet" >> $GITHUB_ENV
            echo "KEYLET_KEY_PASSWORD=keylet-ci" >> $GITHUB_ENV
          fi

      - name: Run unit tests & build Release APK
        working-directory: android
        run: gradle testDebugUnitTest assembleRelease --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: keylet-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
