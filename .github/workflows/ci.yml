name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build packages and Chrome MV3 extension
        run: npm run build

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build Firefox extension & package zips
        run: |
          npm --workspace=keylet run build:firefox
          npm --workspace=keylet run zip

      - name: Upload extension artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keylet-browser-extension
          path: browser-extension/.output/*.zip
